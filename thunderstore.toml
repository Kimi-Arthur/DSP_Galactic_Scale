[config]
schemaVersion = "0.0.1"

[package]
namespace = "Galactic_Scale"
name = "GalacticScale"
versionNumber = "2.81.44"
description = "v2.81.44 Constellation Edition (Synced to upstream 2.81.1): 4K-DPI Safe Moon Label Anti-Overlap (#323) + Shortened Constellation Star Names (#324)"
websiteUrl = "https://github.com/Touhma/DSP_Plugins"
containsNsfwContent = false

[package.dependencies]
"xiaoye97-BepInEx" = "5.4.17"
"crecheng-CloseError" = "1.0.0"

[build]
icon = "./Package/icon.png"
readme = "./Package/README.md"
outdir = "./"

[[build.copy]]
source = "./Package/CHANGELOG.md"
target = "./CHANGELOG.md"
[[build.copy]]
source = "./obj/Debug/net472/GalacticScale.dll"
target = "./GalacticScale.dll"
[[build.copy]]
source = "./Package/GSUI.dll"
target = "./GSUI.dll"
[[build.copy]]
source = "./Package/3rdPartyLicenses.md"
target = "./3rdPartyLicenses.md"
[[build.copy]]
source = "./Package/galacticbundle"
target = "./galacticbundle"
[[build.copy]]
source = "./Package/galacticbundle2"
target = "./galacticbundle2"

[general]
repository = "https://dsp.thunderstore.io"

[publish]
communities = ["dyson-sphere-program"]

